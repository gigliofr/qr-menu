# CI uniforme dei progetti (heroquest-studio, mana-wise, qr-menu, quota-zero, visto-easy).
# Solo controlli: il deploy lo fa Coolify tramite l'integrazione GitHub, indipendentemente da questo workflow.
# Job standard: Go (test; gofmt e vet bloccanti solo se STRICT_LINT=true), Web (se c'è un frontend), Docker (build senza push).

name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRICT_LINT: "false"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Formattazione (gofmt)
        continue-on-error: ${{ env.STRICT_LINT != 'true' }}
        run: |
          files=$(gofmt -l $(git ls-files '*.go' | grep -v '_templ.go$'))
          if [ -n "$files" ]; then echo "::warning::File da formattare con gofmt:"; echo "$files"; exit 1; fi

      - name: Vet
        continue-on-error: ${{ env.STRICT_LINT != 'true' }}
        run: go vet ./...

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build del Dockerfile (senza push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  a11y:
    name: Accessibility (Pa11y)
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Pa11y
        run: npm install -g pa11y

      - name: Start static server
        run: |
          python3 -m http.server 8000 > server.log 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Run Pa11y accessibility checks
        run: |
          cat << 'EOF' > pa11y.config.json
          {
            "chromeLaunchConfig": {
              "args": ["--no-sandbox", "--disable-setuid-sandbox"]
            }
          }
          EOF

          pa11y http://localhost:8000/templates/login.html --reporter cli --config pa11y.config.json
          pa11y http://localhost:8000/templates/guest_access.html --reporter cli --config pa11y.config.json
          pa11y http://localhost:8000/templates/public_menu_preview.html --reporter cli --config pa11y.config.json

      - name: Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright deps
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Build Go app
        run: go build -o qr-menu .

      - name: Start Go app (file-fallback mode)
        run: |
          ./qr-menu > app.log 2>&1 &
          echo $! > app.pid
        env:
          PORT: 8080

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "App is ready!"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 1
          done
          echo "App failed to start in time"
          cat app.log
          exit 1

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:8080

      - name: Cleanup
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) 2>/dev/null || true
          fi
