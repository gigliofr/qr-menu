<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Sei offline | QR Menu</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      background: radial-gradient(circle at 10% 20%, #e0e7ff, #f8fafc 40%, #ffffff 100%);
      color: #0f172a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(1.8rem, 6vw, 2.4rem); }
    p { margin: 0 0 18px; color: #334155; line-height: 1.55; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button, a {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      padding: 10px 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Connessione assente</h1>
    <p>Non riesco a raggiungere il server. Se hai già aperto questo menu in precedenza, alcune pagine possono restare disponibili in cache.</p>
    <div class="row">
      <button onclick="location.reload()">Riprova</button>
      <a href="/">Torna alla home</a>
    </div>
  </main>
</body>
</html>
