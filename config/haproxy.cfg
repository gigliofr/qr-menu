global
    log stdout local0
    log stdout local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Default SSL settings
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client 50000
    timeout server 50000

listen stats
    bind 0.0.0.0:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# Frontend per il traffic HTTP/HTTPS
frontend qr_menu_https
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/qr-menu.pem
    bind 0.0.0.0:80
    redirect scheme https code 301 if !{ ssl_fc }

    # Logging
    log global
    option httplog
    option http-server-close

    # Request ID per tracing
    unique-id-format %{+X}o\ %ci:%cp_%t_%pid
    unique-id-header X-Request-ID

    # Gestione rate limiting per endpoint specifici
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 100 }

    # ACL per routing
    acl is_health path /api/v1/health
    acl is_metrics path /metrics
    acl is_cache path /cache
    acl is_admin path_beg /admin
    acl is_static path_beg /static
    acl is_qrcode path_beg /qr

    # Route a backend diversi
    use_backend backend_health if is_health
    use_backend backend_metrics if is_metrics
    use_backend backend_cache if is_cache
    use_backend backend_app if is_admin
    use_backend backend_static if is_static
    use_backend backend_app if is_qrcode
    default_backend backend_app

# Backend per app principale (multiple instances)
backend backend_app
    balance roundrobin
    option httpchk GET /api/v1/health
    default-server inter 10s fall 3 rise 2

    server app1 localhost:8081 check
    server app2 localhost:8082 check
    server app3 localhost:8083 check

# Backend per health checks (cache locale)
backend backend_health
    balance roundrobin
    server app1 localhost:8081
    server app2 localhost:8082
    server app3 localhost:8083

# Backend per metrics (one instance only)
backend backend_metrics
    balance roundrobin
    server app1 localhost:8081

# Backend per cache operations
backend backend_cache
    balance roundrobin
    option httpchk GET /cache/stats
    default-server inter 30s fall 2 rise 1
    server app1 localhost:8081 check
    server app2 localhost:8082 check
    server app3 localhost:8083 check

# Backend per file statici (can use CDN in production)
backend backend_static
    balance roundrobin
    option httpchk GET /static/manifest.json
    default-server inter 60s fall 1 rise 1
    server app1 localhost:8081 check
    server app2 localhost:8082 check
    server app3 localhost:8083 check
