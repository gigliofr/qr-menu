<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Login - QR Menu System</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS: Load new design system -->
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            font-family: var(--font-family-base);
            font-size: var(--font-size-md);
            color: var(--color-text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Login Container */
        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--color-bg-primary);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
            border: 1px solid var(--color-border-light);
        }
        
        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .login-header-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
        }
        
        .login-header h1 {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-sm);
            color: var(--color-text-primary);
        }
        
        .login-header p {
            font-size: var(--font-size-sm);
            color: #E5E7EB; /* light text for dark card background */
            line-height: var(--line-height-normal);
            font-weight: var(--font-weight-medium);
        }
        
        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }
        
        .form-group label {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
        }
        
        .form-group input {
            padding: var(--spacing-md);
            border: 1px solid var(--color-border-medium);
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-family: var(--font-family-base);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        
        .form-group input::placeholder {
            color: #9CA3AF;
        }
        
        /* Remember Me */
        .form-check {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .form-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .form-check label {
            font-size: var(--font-size-sm);
            cursor: pointer;
            margin: 0;
            font-weight: var(--font-weight-medium);
            color: #E5E7EB; /* readable on dark background */
        }
        
        /* Buttons */
        .btn-submit {
            padding: var(--spacing-md) var(--spacing-lg);
            background-color: #0072ef;
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        
        .btn-submit:hover {
            background-color: #005ac2;
            transform: translateY(-1px);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            padding: var(--spacing-md) var(--spacing-lg);
            background-color: transparent;
            color: var(--color-text-primary);
            border: 1px solid var(--color-border-medium);
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            width: 100%;
        }
        
        .btn-secondary:hover {
            background-color: var(--color-bg-secondary);
            border-color: var(--color-border-dark);
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin: var(--spacing-lg) 0;
            color: #E5E7EB; /* readable on dark background */
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--color-border-light);
        }
        
        /* Footer */
        .login-footer {
            border-top: 1px solid var(--color-border-light);
            padding-top: var(--spacing-lg);
            text-align: center;
        }
        
        .login-footer p {
            font-size: var(--font-size-sm);
            color: #E5E7EB;
            margin-bottom: var(--spacing-sm);
            line-height: var(--line-height-normal);
            font-weight: var(--font-weight-medium);
        }

        .login-footer a {
            color: #7FB3FF; /* lighter blue for visibility on dark card */
            text-decoration: underline;
            text-decoration-thickness: 2px;
            font-weight: var(--font-weight-semibold);
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: #5AA0FF;
        }
        
        /* Error Message */
        .error-message {
            display: none;
            padding: var(--spacing-md);
            background-color: var(--color-danger-light);
            color: var(--color-danger);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--color-danger);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-lg);
        }
        
        .error-message.show {
            display: block;
        }
        
        /* Mobile Responsive */
        @media (max-width: 480px) {
            body {
                padding: var(--spacing-sm);
            }
            
            .login-container {
                max-width: 100%;
                padding: var(--spacing-lg);
            }
            
            .login-header h1 {
                font-size: var(--font-size-2xl);
            }
            
            .login-header-icon {
                font-size: 2.5rem;
            }
            
            .login-form {
                gap: var(--spacing-md);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="login-header-icon">🍽️</div>
            <h1>QR Menu</h1>
            <p>Gestisci i tuoi menu digitali con eleganza</p>
        </div>
        
        <!-- Error Message -->
        <div class="error-message" id="errorMessage"></div>
        
        <!-- Login Form -->
        <form class="login-form" method="POST" action="/login" id="loginForm">
            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="nome@esempio.it"
                    required
                    autocomplete="email"
                />
            </div>
            
            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                />
            </div>
            
            <!-- Remember Me -->
            <div class="form-check">
                <input 
                    type="checkbox" 
                    id="remember" 
                    name="remember"
                />
                <label for="remember">Ricordami su questo dispositivo</label>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Accedi</button>
        </form>
        
        <!-- Divider -->
        <div class="divider">oppure</div>
        
        <!-- Guest Login -->
        <button type="button" class="btn-secondary">Continua come ospite</button>
        
        <!-- Footer -->
        <div class="login-footer">
            <p>
                Non hai un account? 
                <a href="/register">Registrati qui</a>
            </p>
            <p>
                <a href="/forgot-password">Password dimenticata?</a>
            </p>
        </div>
    </div>
    
    <!-- Script -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            if (!email || !password) {
                showError('Email e password sono obbligatori');
                return;
            }
            
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
            
            try {
                const button = e.target.querySelector('button[type="submit"]');
                button.disabled = true;
                button.textContent = 'Accesso in corso...';
                
                // In production, replace with actual API call
                await new Promise(resolve => setTimeout(resolve, 800));
                
                button.disabled = false;
                button.textContent = 'Accedi';
                
                // window.location.href = '/dashboard';
                
            } catch (error) {
                showError('Errore di connessione. Riprova più tardi.');
                button.disabled = false;
                button.textContent = 'Accedi';
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }
    </script>
</body>
</html>

</body>
</html>
