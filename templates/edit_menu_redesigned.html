<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modifica Menu - QR Menu</title>
  <link rel="stylesheet" href="/static/css/design-system.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/icons.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/platform.css">
</head>
<body>
  <div class="container">
    <header class="navbar mb-md">
      <div class="container flex-between">
        <a class="navbar-brand" href="/admin">🍽️ QR Menu</a>
        <div>
          <a class="nav-link" href="/admin/menus">Torna ai Menù</a>
        </div>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="card-header">
          <h2 class="h2">Modifica Menu</h2>
        </div>
        <form class="card-body" method="POST" action="/admin/menus/{{.Menu.ID}}/update" enctype="multipart/form-data">
          <div class="form-group">
            <label for="name">Nome del Menu <span class="required">*</span></label>
            <input id="name" name="name" type="text" value="{{.Menu.Name}}" required />
          </div>

          <div class="form-group">
            <label for="description">Descrizione</label>
            <textarea id="description" name="description">{{.Menu.Description}}</textarea>
          </div>

          <div class="form-group">
            <label for="image">Immagine di copertina</label>
            <input id="image" name="image" type="file" accept="image/*" />
            <small class="form-text">Lascia vuoto per mantenere l'immagine attuale</small>
          </div>

          <div class="form-group">
            <label for="visibility">Visibilità</label>
            <select id="visibility" name="visibility">
              <option value="public" {{if eq .Menu.Visibility "public"}}selected{{end}}>Pubblico</option>
              <option value="private" {{if eq .Menu.Visibility "private"}}selected{{end}}>Privato</option>
            </select>
          </div>

          <div class="card-footer">
            <button type="submit" class="btn btn-primary">Salva</button>
            <a href="/admin/menus" class="btn btn-secondary">Annulla</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
