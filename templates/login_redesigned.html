<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Login - QR Menu System</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS: Load new design system -->
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/platform.css">
    
    <style>
        /* Login Page Specific Styles */
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease;
        }
        
        .login-card {
            background: var(--color-bg-primary);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border-light);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .login-logo {
            font-size: 3em;
            margin-bottom: var(--spacing-md);
            display: inline-block;
        }
        
        .login-card h1 {
            font-size: var(--font-size-3xl);
            margin-bottom: var(--spacing-sm);
            text-align: center;
            color: var(--color-text-primary);
        }
        
        .login-card p {
            text-align: center;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-lg);
            font-size: var(--font-size-md);
        }
        
        .login-form {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .login-button {
            width: 100%;
            margin-bottom: var(--spacing-md);
        }
        
        .login-divider {
            display: flex;
            align-items: center;
            margin: var(--spacing-lg) 0;
            color: var(--color-text-tertiary);
            font-size: var(--font-size-sm);
        }
        
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--color-border-light);
        }
        
        .login-divider span {
            padding: 0 var(--spacing-md);
        }
        
        .login-footer {
            text-align: center;
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border-light);
        }
        
        .login-footer p {
            margin: var(--spacing-sm) 0;
            font-size: var(--font-size-sm);
        }
        
        .login-footer a {
            color: var(--color-primary);
            font-weight: var(--font-weight-semibold);
            text-decoration: none;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background-color: var(--color-danger-light);
            color: var(--color-danger);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            border-left: 4px solid var(--color-danger);
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--font-size-sm);
        }
        
        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Mobile Optimizations */
        @media (max-width: 640px) {
            .login-card {
                padding: var(--spacing-lg);
                border-radius: var(--radius-lg);
            }
            
            .login-card h1 {
                font-size: var(--font-size-2xl);
            }
            
            body {
                padding: var(--spacing-sm);
            }
        }
        
        @media (max-width: 480px) {
            .login-wrapper {
                max-width: 100%;
            }
            
            .login-card {
                padding: var(--spacing-lg);
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">🍽️</div>
                <h1>QR Menu</h1>
                <p>Gestisci i tuoi menu digitali con eleganza</p>
            </div>
            
            <!-- Error Message -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Login Form -->
            <form class="login-form" method="POST" action="/login" id="loginForm">
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">
                        Email
                        <span class="required">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="nome@esempio.it"
                        required
                        autocomplete="email"
                    />
                </div>
                
                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">
                        Password
                        <span class="required">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    />
                </div>
                
                <!-- Remember Me -->
                <div class="form-check" style="margin-bottom: var(--spacing-lg);">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        name="remember"
                    />
                    <label for="remember" style="margin-bottom: 0; font-weight: normal;">
                        Ricordami su questo dispositivo
                    </label>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-lg btn-full">
                    Accedi
                </button>
            </form>
            
            <!-- Divider -->
            <div class="login-divider">
                <span>oppure</span>
            </div>
            
            <!-- Social/Alternative Login (Placeholder) -->
            <button type="button" class="btn btn-secondary btn-md btn-full" style="margin-bottom: var(--spacing-sm);">
                Continua come ospite
            </button>
            
            <!-- Footer -->
            <div class="login-footer">
                <p>
                    Non hai un account? 
                    <a href="/register">Registrati qui</a>
                </p>
                <p>
                    <a href="/forgot-password">Password dimenticata?</a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Script -->
    <script>
        // Form Validation & Submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            // Validate
            if (!email || !password) {
                showError('Email e password sono obbligatori');
                return;
            }
            
            // Clear previous errors
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
            
            try {
                // Simulate submission (replace with actual API call)
                const button = e.target.querySelector('button[type="submit"]');
                button.classList.add('loading');
                
                // In production, send to your actual backend
                // const response = await fetch('/api/login', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ email, password })
                // });
                
                // Simulated delay
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                button.classList.remove('loading');
                
                // Redirect on success
                // window.location.href = '/dashboard';
                
            } catch (error) {
                showError('Errore di connessione. Riprova più tardi.');
                button.classList.remove('loading');
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }
        
        // Mobile Detection
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile && window.matchMedia('(display-mode: standalone)').matches) {
            console.log('App running in PWA mode');
        }
    </script>
</body>
</html>
